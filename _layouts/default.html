<!DOCTYPE html>
<html lang="ko" data-theme="light" data-font-scale="normal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.subtitle | default: site.description }}">
  <link rel="manifest" href="{{ '/manifest.json' | relative_url }}">
  <meta name="theme-color" content="#4f46e5">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --primary-soft: rgba(79, 70, 229, 0.1);
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --bg-page: #f4f5f7;
      --bg-surface: #ffffff;
      --bg-subtle: #f8fafc;
      --text-main: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --card-shadow: 0 12px 30px rgba(15, 23, 42, 0.07), 0 4px 12px rgba(15, 23, 42, 0.04);
      --card-shadow-sm: 0 2px 8px rgba(15, 23, 42, 0.05);
      --base-font-size: 16px;
    }
    [data-theme="dark"] {
      --bg-page: #0b1120;
      --bg-surface: #1e293b;
      --bg-subtle: #0f172a;
      --text-main: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --primary: #818cf8;
      --primary-soft: rgba(129, 140, 248, 0.16);
    }
    [data-font-scale="large"] { --base-font-size: 17.5px; }
    [data-font-scale="xlarge"] { --base-font-size: 19px; }

    * { box-sizing: border-box; }
    html { font-size: var(--base-font-size); }
    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, "Noto Sans KR", sans-serif;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    a { color: var(--primary); text-decoration: none; }

    .site-navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-color);
    }
    [data-theme="dark"] .site-navbar { background: rgba(15, 23, 42, 0.9); }
    .nav-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
    }
    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 900;
      font-size: 1.2rem;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }
    .logo-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 900;
    }
    .nav-links { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .nav-btn {
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-secondary);
      transition: all 0.2s;
    }
    .nav-btn:hover { background: var(--primary-soft); color: var(--primary); }
    .util-btn {
      cursor: pointer;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-main);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
    }
    .page-container {
      max-width: 1180px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }
    .site-footer {
      border-top: 1px solid var(--border-color);
      background: var(--bg-surface);
      padding: 34px 24px;
      margin-top: 64px;
      color: var(--text-muted);
      font-size: 0.86rem;
    }
    .footer-inner {
      max-width: 1180px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }
    .admin-discrete-link {
      color: var(--text-muted);
      opacity: 0.45;
      font-size: 0.78rem;
      transition: opacity 0.2s;
    }
    .admin-discrete-link:hover { opacity: 1; }
  </style>
</head>
<body>
  <header class="site-navbar">
    <div class="nav-inner">
      <a href="{{ '/' | relative_url }}" class="brand-logo">
        <span class="logo-mark">CL</span>
        <span>ChooSu Lab</span>
      </a>
      <nav class="nav-links">
        <a href="{{ '/' | relative_url }}" class="nav-btn">전체 아카이브</a>
        <a href="{{ '/' | relative_url }}#concept-notes" class="nav-btn">핵심 개념 노트</a>
        <button class="util-btn" onclick="cycleFontSize()" id="fontScaleBtn">글자 크기: 기본</button>
        <button class="util-btn" id="themeToggleBtn" onclick="toggleTheme()">다크 모드</button>
      </nav>
    </div>
  </header>

  <main class="page-container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <strong style="color:var(--text-main);">ChooSu Lab — 컴퓨팅 아카이브 &amp; 디지털 리터러시 연구실</strong><br>
        <span>본 블로그의 일부 콘텐츠와 환경 테스트 자료는 AI를 활용하여 생성·정리되었습니다.</span>
      </div>
      <div>
        <a href="{{ '/admin.html' | relative_url }}" class="admin-discrete-link" title="관리자 전용">⚙️ Manage</a>
      </div>
    </div>
  </footer>

  <script>
    (function() {
      const savedTheme = localStorage.getItem('choosu-theme') || 'light';
      document.documentElement.setAttribute('data-theme', savedTheme);
      const tBtn = document.getElementById('themeToggleBtn');
      if (tBtn) tBtn.textContent = savedTheme === 'dark' ? '라이트 모드' : '다크 모드';

      const savedScale = localStorage.getItem('choosu-font-scale') || 'normal';
      document.documentElement.setAttribute('data-font-scale', savedScale);
      updateScaleLabel(savedScale);
    })();

    function toggleTheme() {
      const cur = document.documentElement.getAttribute('data-theme') || 'light';
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('choosu-theme', next);
      const tBtn = document.getElementById('themeToggleBtn');
      if (tBtn) tBtn.textContent = next === 'dark' ? '라이트 모드' : '다크 모드';
    }

    function cycleFontSize() {
      const order = ['normal', 'large', 'xlarge'];
      const cur = document.documentElement.getAttribute('data-font-scale') || 'normal';
      const next = order[(order.indexOf(cur) + 1) % order.length];
      document.documentElement.setAttribute('data-font-scale', next);
      localStorage.setItem('choosu-font-scale', next);
      updateScaleLabel(next);
    }

    function updateScaleLabel(scale) {
      const fBtn = document.getElementById('fontScaleBtn');
      if (!fBtn) return;
      const labels = { 'normal': '글자 크기: 기본', 'large': '글자 크기: 크게(110%)', 'xlarge': '글자 크기: 특대(120%)' };
      fBtn.textContent = labels[scale] || labels['normal'];
    }
  </script>
</body>
</html>
