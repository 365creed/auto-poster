name: Auto Tech Blog Publisher

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 한국 시간 오전 9시 자동 발행
  workflow_dispatch:      # 수동 실행 버튼

jobs:
  run-publisher:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 생성된 글(.md)과 이미지를 저장소에 커밋하기 위한 권한

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    - name: 파이썬 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 한글 폰트 및 패키지 설치
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-nanum
        pip install google-genai playwright beautifulsoup4 requests pillow
        playwright install chromium --with-deps

    - name: 글 및 실제 이미지 생성 스크립트 실행
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python tistory_poster.py

    - name: 생성된 포스팅 및 이미지 자동 배포 (Git Push)
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "ChooSu Auto Bot"
        git add _posts/ assets/ posted_history.txt
        git diff --staged --quiet || git commit -m "Auto publish new tech post"
        git push
