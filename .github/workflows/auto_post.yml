name: Auto Tech Blog Publisher

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 한국 시간 오전 9시 자동 실행
  workflow_dispatch:      # Actions 탭에서 'Run workflow' 수동 실행 버튼 활성화

# GitHub Pages 배포와 저장소 파일 수정 권한 동시 부여
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 한글 폰트 및 필수 패키지 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-nanum
          pip install google-genai playwright beautifulsoup4 requests pillow
          playwright install chromium --with-deps

      - name: 파이썬 포스팅 및 이미지 생성 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        python tistory_poster.py

      - name: 생성된 포스팅 Git Commit & Push
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "ChooSu Auto Bot"
          git add .
          git diff --staged --quiet || git commit -m "Auto publish new tech post via Actions"
          git push

      - name: GitHub Pages 업로드 아티팩트 설정
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs_url }}
    steps:
      - name: GitHub Pages에 배포
        id: deployment
        uses: actions/deploy-pages@v4
