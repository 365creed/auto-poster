name: Tistory Auto Post

on:
  schedule:
    - cron: '0 0 * * *'  # 매일 한국 시간 오전 9시 자동 실행
  workflow_dispatch:      # 수동 실행 버튼

jobs:
  run-poster:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # 작성 완료한 글 기록(posted_history.txt) 저장을 위한 권한

    steps:
    - name: 코드 가져오기
      uses: actions/checkout@v4

    - name: 파이썬 설정
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 한글 폰트 및 필수 패키지 설치
      run: |
        sudo apt-get update
        sudo apt-get install -y fonts-nanum
        pip install google-genai playwright beautifulsoup4 requests pillow
        playwright install chromium --with-deps

    - name: 포스팅 실행
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        TISTORY_COOKIE_JSON: ${{ secrets.TISTORY_COOKIE_JSON }}
      run: python tistory_poster.py

    - name: 발행 기록(posted_history.txt) 자동 저장
      run: |
        if [ -f posted_history.txt ]; then
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Action"
          git add posted_history.txt
          git diff --staged --quiet || git commit -m "Update posted history"
          git push
        fi
